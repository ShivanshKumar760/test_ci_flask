apiVersion: v1
kind: Service
metadata:
  name: postgres-service-flask
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: flaskapi-ci-test-svc
spec:
  selector:
    app: flaskapi-ci-test
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30112
  type: NodePort
